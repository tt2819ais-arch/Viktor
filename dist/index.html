    <title>Моя музыка</title>
    <script>
      // Apply persisted theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("viktor.theme");
          var root = document.documentElement;
          if (t === "light") {
            root.classList.remove("dark");
          } else {
            root.classList.add("dark");
          }
          var l = localStorage.getItem("viktor.lang");
          if (l === "en" || l === "ru") root.setAttribute("lang", l);
        } catch (e) {}
      })();
    </script>
