services:
  - type: web
    name: music-player
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: YANDEX_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.5
