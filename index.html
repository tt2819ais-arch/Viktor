<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Viktor — media player" />
    <title>Viktor</title>
    <script>
      // Apply persisted theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("viktor.theme");
          var root = document.documentElement;
          if (t === "light") {
            root.classList.remove("dark");
          } else {
            root.classList.add("dark");
          }
          var l = localStorage.getItem("viktor.lang");
          if (l === "en" || l === "ru") root.setAttribute("lang", l);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
